<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Atemschutz – QR-Meldung V21</title><style>:root{font-family:system-ui,Arial;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101923;color:#edf4fa}main{max-width:650px;margin:auto;padding:18px}h1{font-size:1.65rem;margin:12px 0 6px}h2{font-size:1.12rem;margin:0 0 12px}h3{font-size:1rem;margin:16px 0 8px}section{box-shadow:0 2px 10px #0002}select,input,textarea{min-height:46px}.choice{min-height:52px}.choice:has(input:checked){border-color:#6ec2f5;background:#233f55}#submit{font-size:1.08rem;min-height:54px;background:#168453}#submit:disabled{opacity:.65}.intro{color:#b5c7d6;margin:0 0 18px}.step{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#1670a6;color:white;margin-right:8px;font-weight:800}.optional{font-weight:400;color:#b5c7d6}section{background:#1d2b39;border:1px solid #415363;border-radius:13px;padding:16px;margin:15px 0}label{display:block;font-weight:650;margin:12px 0 6px}select,input,textarea,button{width:100%;font:inherit;border-radius:9px;padding:12px;background:#0e1823;color:#fff;border:1px solid #6d8194}button{background:#1670a6;border:0;font-weight:700;cursor:pointer;margin-top:12px}.secondary{background:#364a5e}.warning{color:#ffe2a2}.muted{color:#b5c7d6;font-size:.9rem}.choice{display:flex;align-items:center;gap:12px;border:1px solid #43576b;padding:12px;margin:8px 0;border-radius:9px}.choice input{width:auto;transform:scale(1.25)}.choice label{margin:0;font-weight:400;flex:1}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.entry{padding:12px;border:1px dashed #72869a;border-radius:9px;margin-top:12px}.hidden{display:none}a{color:#8dd4ff}#result{white-space:pre-wrap;background:#17364b;padding:14px;border-radius:10px;margin:16px 0}.equipment-group{margin:14px 0;padding:14px;border:1px solid #51677a;border-radius:11px;background:#152434}.equipment-group h3{margin:0 0 12px;font-size:1.06rem;color:#fff}</style></head><body><main><h1>Atemschutz melden</h1><p class="intro">Benutzte Atemschutzgeräte und Masken melden</p><section><h2><span class="step">1</span>Fahrzeug auswählen</h2><label for="vehicle">Fahrzeug</label><select id="vehicle"><option value="">Bitte auswählen</option></select><div id="used"><p class="muted">Bitte zuerst ein Fahrzeug auswählen.</p></div></section><section><h2><span class="step">3</span>Neu bestückt?</h2><div class="choice"><input type="radio" name="replaced" id="repNo" value="no" checked><label for="repNo">Nein</label></div><div class="choice"><input type="radio" name="replaced" id="repYes" value="yes"><label for="repYes">Ja</label></div><div id="replacement" class="hidden"><label for="source">Woher kommt der Ersatz?</label><select id="source"><option value="">Bitte Herkunft wählen</option></select><div id="sourceContent"></div></div></section><section><h2><span class="step">4</span>Meldung abschließen</h2><label for="usedAt">Wann wurden die Geräte benutzt? *</label><input id="usedAt" type="datetime-local" required><label for="reporter">Dein Name <span class="optional">(freiwillig)</span></label><input id="reporter" placeholder="Name, falls gewünscht"><label for="remark">Bemerkung <span class="optional">(freiwillig)</span></label><textarea id="remark" rows="3" placeholder="Zusätzliche Hinweise"></textarea><button id="submit">Meldung absenden</button></section><div id="result" class="hidden" role="status"></div></main><script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbxEMwwtjLm7wMbfHcIVBbl3-BNrbeVCgnN6Gmn1d4CPmhZTs5zDZmEBmbTZRePoFuBi/exec';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let catalog=null,submitting=false;
const key=new URLSearchParams(location.hash.slice(1)).get('zugang')||'';
function setStatus(msg){$('result').classList.remove('hidden');$('result').textContent=msg;}
function loadCatalog(){const script=document.createElement('script');script.src=ENDPOINT+'?action=catalog&callback=v21CatalogLoaded&_='+Date.now();script.onerror=()=>setStatus('Die V21-Zentrale ist nicht erreichbar.');document.head.append(script);setTimeout(()=>{if(!catalog)setStatus('Keine Antwort der V21-Zentrale. Bitte Verbindung prüfen.')},15000)}
window.v21CatalogLoaded=response=>{if(!response?.ok||response.catalog?.schema!=='atemschutz-v21-qr-catalog-v1'){setStatus('Bestand konnte nicht geladen werden: '+(response?.error||'Ungültige Antwort'));return}catalog=response.catalog;const sel=$('vehicle');sel.replaceChildren(new Option('Bitte Fahrzeug auswählen',''));for(const v of catalog.vehicles)sel.add(new Option(v.name,v.id));sel.add(new Option('Lager','__lager__'));const src=$('source');src.replaceChildren(new Option('Bitte Herkunft auswählen',''),new Option('Lager','__lager__'));for(const v of catalog.vehicles)src.add(new Option(v.name,v.id));src.add(new Option('GW Atemschutz','gw'));$('used').textContent='Bitte Fahrzeug auswählen.';setStatus('Aktueller Bestand geladen. Fahrzeug auswählen.');};
function itemLabel(item){return item.deviceNo?'Gerät '+item.deviceNo+' · LA '+(item.laNo||'—')+' · Flasche '+(item.bottleNo||'—'):'Maske '+item.maskNo}
function checks(items,cls){return items.length?items.map(x=>`<div class="choice"><input type="checkbox" class="${cls}" id="${cls+esc(x.id)}" value="${esc(x.id)}"><label for="${cls+esc(x.id)}">${esc(itemLabel(x))}</label></div>`).join(''):'<p class="muted">Keine Positionen vorhanden.</p>'}
function positions(location){return [...(catalog?.devices||[]),...(catalog?.masks||[])].filter(x=>x.vehicleId===location)}
function refreshUsed(){const v=$('vehicle').value;const items=positions(v);const devices=items.filter(x=>!!x.deviceNo),masks=items.filter(x=>!x.deviceNo);$('used').innerHTML=v?'<h2 style="margin-top:20px"><span class="step">2</span>Was wurde benutzt?</h2><div class="equipment-group"><h3>Benutzte Atemschutzgeräte</h3>'+checks(devices,'usedItem')+'</div><div class="equipment-group"><h3>Benutzte Masken</h3>'+checks(masks,'usedItem')+'</div>':'<p class="muted">Bitte Fahrzeug auswählen.</p>';refreshSource()}
function refreshSource(){const src=$('source').value,el=$('sourceContent');if(!src){el.innerHTML='';return}if(src==='gw'){el.innerHTML='<h3>Ersatz vom GW Atemschutz</h3><p class="muted">Nummern eintragen. Bei Masken das letzte Prüfdatum auswählen.</p><div id="gwDevices"></div><button type="button" class="secondary" onclick="addGwDevice()">+ Atemschutzgerät hinzufügen</button><div id="gwMasks"></div><button type="button" class="secondary" onclick="addGwMask()">+ Maske hinzufügen</button>';addGwDevice();return}if(src===$('vehicle').value){el.textContent='Herkunft und Ziel dürfen nicht gleich sein.';return}el.innerHTML='<h3>Verfügbare Ersatzgeräte und Masken</h3>'+checks(positions(src),'replacementItem')}
function addGwDevice(){const el=document.createElement('div');el.className='entry gw-device';el.innerHTML='<strong>Neues Atemschutzgerät</strong><label>Gerätenummer *</label><input class="gw-device-no" autocomplete="off"><label>Lungenautomatnummer *</label><input class="gw-la-no" autocomplete="off"><label>Flaschennummer *</label><input class="gw-bottle-no" autocomplete="off"><p class="muted">Eingang: '+new Date().toLocaleDateString('de-DE')+'</p><button type="button" class="secondary" onclick="this.parentElement.remove()">Eintrag entfernen</button>';$('gwDevices').append(el)}
function addGwMask(){const el=document.createElement('div');el.className='entry gw-mask';el.innerHTML='<strong>Neue Maske</strong><label>Maskennummer *</label><input class="gw-mask-no" autocomplete="off"><label>Letztes Prüfdatum der Maske *</label><input type="date" class="gw-mask-date" required><button type="button" class="secondary" onclick="this.parentElement.remove()">Eintrag entfernen</button>';$('gwMasks').append(el)}
$('vehicle').onchange=refreshUsed;$('source').onchange=refreshSource;document.querySelectorAll('input[name="replaced"]').forEach(x=>x.onchange=()=>{$('replacement').classList.toggle('hidden',!$('repYes').checked)});
function localDateTime(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}$('usedAt').value=localDateTime();
function centralPost(payload){return new Promise((resolve,reject)=>{const nonce=crypto.randomUUID().replaceAll('-','');const frame=document.createElement('iframe');frame.name='v21_'+nonce;frame.style.display='none';const form=document.createElement('form');form.method='POST';form.action=ENDPOINT;form.target=frame.name;form.style.display='none';const fields={action:'report',payload:JSON.stringify(payload),accessToken:key,bridge:'1',nonce};for(const [k,v] of Object.entries(fields)){const i=document.createElement('input');i.name=k;i.value=v;form.append(i)}let done=false;const timer=setTimeout(()=>finish(Error('Zeitüberschreitung bei der Übertragung')),45000);function finish(err,result){if(done)return;done=true;clearTimeout(timer);window.removeEventListener('message',onMessage);form.remove();setTimeout(()=>frame.remove(),500);err?reject(err):resolve(result)}function onMessage(event){if(!['https://script.google.com','https://script.googleusercontent.com'].includes(event.origin)&&!/^https:\/\/[a-z0-9-]+(?:-|\.)script\.googleusercontent\.com$/.test(event.origin))return;const m=event.data;if(m?.v21&&m.nonce===nonce)finish(null,m.result)}window.addEventListener('message',onMessage);document.body.append(frame,form);form.submit()})}
$('submit').onclick=async()=>{if(submitting)return;if(!catalog)return setStatus('Bitte zuerst den Bestand laden.');if(!/^[a-zA-Z0-9]{64}$/.test(key))return setStatus('QR-Zugang fehlt oder ist ungültig. Bitte den vollständigen QR-Code scannen.');const vehicle=$('vehicle').value;if(!vehicle)return alert('Bitte Fahrzeug auswählen.');const used=[...document.querySelectorAll('.usedItem:checked')].map(x=>({id:x.value,label:itemLabel(positions(vehicle).find(y=>y.id===x.value))}));if(!used.length)return alert('Bitte mindestens ein benutztes Gerät oder eine Maske auswählen.');const at=new Date($('usedAt').value);if(!Number.isFinite(at.getTime())||at.getTime()>Date.now()+300000)return alert('Bitte gültigen Benutzungszeitpunkt angeben.');let replacement=null;if($('repYes').checked){const source=$('source').value;if(!source||source===vehicle)return alert('Bitte eine andere Herkunft wählen.');if(source==='gw'){const devices=[...document.querySelectorAll('.gw-device')].map(el=>({deviceNo:el.querySelector('.gw-device-no').value.trim(),laNo:el.querySelector('.gw-la-no').value.trim(),bottleNo:el.querySelector('.gw-bottle-no').value.trim()}));const masks=[...document.querySelectorAll('.gw-mask')].map(el=>({maskNo:el.querySelector('.gw-mask-no').value.trim(),testDate:el.querySelector('.gw-mask-date').value}));if(!devices.length&&!masks.length)return alert('Bitte mindestens ein Gerät oder eine Maske eintragen.');if(devices.some(x=>!x.deviceNo||!x.laNo||!x.bottleNo)||masks.some(x=>!x.maskNo||!/^\d{4}-\d{2}-\d{2}$/.test(x.testDate)))return alert('Bitte alle Nummern vollständig eintragen.');replacement={source:'gw',devices,masks};}else{const selected=[...document.querySelectorAll('.replacementItem:checked')].map(x=>({id:x.value,label:itemLabel(positions(source).find(y=>y.id===x.value))}));if(!selected.length)return alert('Bitte Ersatzgeräte auswählen.');replacement={source,selected};}}const report={vehicle,used,usedAt:at.toISOString(),replacement,reporter:$('reporter').value.trim(),remark:$('remark').value.trim()+(replacement?.source==='gw'?'\nGW AS – neu ausgegeben:\n'+replacement.devices.map(x=>'Gerät '+x.deviceNo+' / LA '+x.laNo+' / Flasche '+x.bottleNo).concat(replacement.masks.map(x=>'Maske '+x.maskNo+' / Prüfung '+x.testDate)).join('\n'):'')};submitting=true;$('submit').disabled=true;setStatus('Meldung wird übertragen …');try{const r=await centralPost(report);if(!r?.ok)throw Error(r?.error||'Unbekannter Fehler');setStatus('Die Meldung wurde verschickt.\nDu kannst diese Seite jetzt schließen.');$('submit').textContent='Meldung eingegangen';alert('Die Meldung wurde verschickt\n\nDu kannst diese Seite jetzt schließen.');}catch(e){submitting=false;$('submit').disabled=false;setStatus('Nicht übertragen: '+e.message+'\nBitte erneut versuchen.')}};
loadCatalog();
</script></body></html>
